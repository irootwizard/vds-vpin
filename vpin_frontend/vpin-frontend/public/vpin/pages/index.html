<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VDS-VPIN 工作台</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/theme.css">
    <style>
        /* 科技感蓝色增强样式 */
        .gradient-bg {
            background: linear-gradient(135deg, #f0f8ff 0%, #e6f7ff 50%, #d0e8ff 100%);
        }
        
        .tech-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(24, 144, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 80, 179, 0.1);
        }
        
        .glow-effect {
            position: relative;
        }
        
        .glow-effect::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: var(--border-radius-lg);
            background: linear-gradient(135deg, rgba(24, 144, 255, 0.2), transparent);
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .glow-effect:hover::before {
            opacity: 1;
        }
        
        .data-flow {
            position: relative;
            overflow: hidden;
        }
        
        .data-flow::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                to bottom right,
                transparent 30%,
                rgba(24, 144, 255, 0.08) 50%,
                transparent 70%
            );
            animation: flow 20s linear infinite;
            transform: rotate(45deg);
        }
        
        @keyframes flow {
            0% { transform: translateY(-100%) rotate(45deg); }
            100% { transform: translateY(100%) rotate(45deg); }
        }
        
        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #1890ff;
            box-shadow: 0 0 0 0 rgba(24, 144, 255, 0.7);
            animation: pulse-blue 2s infinite;
        }
        
        @keyframes pulse-blue {
            0% { box-shadow: 0 0 0 0 rgba(24, 144, 255, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(24, 144, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(24, 144, 255, 0); }
        }
        
        /* 蓝色文字样式 */
        .blue-text {
            color: #1890ff;
        }
        
        .dark-blue-text {
            color: #096dd9;
        }
        
        .light-blue-text {
            color: #69c0ff;
        }
        
        .blue-heading {
            color: #096dd9;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="app-container gradient-bg">
        <div data-include="../components/header.html"></div>
        
        <div class="main-content">
            <div data-include="../components/sidebar.html"></div>
            
            <div class="content-wrapper">
                <div class="page-container">
                    <div class="welcome-section tech-card data-flow" style="border-radius: 16px; margin-bottom: 24px; padding: 28px;">
                        <h1 style="font-size: 30px; font-weight: 700; color: #096dd9; margin-bottom: 8px;">
                            VDS-VPIN <span style="color: #69c0ff; font-weight: 300;">实验控制台</span>
                        </h1>
                        <p style="color: #595959; margin: 0;">
                            按论文复现实验流程：参数初始化 -> 模型选择（模型中心） -> 数据配置与预处理（新建任务） -> 推理执行
                        </p>
                    </div>

                    <div class="tech-card" style="border-radius: 16px; padding: 24px; margin-bottom: 24px;">
                        <h2 style="color: #096dd9; margin-bottom: 16px;">1. 参数初始化与预计算表</h2>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 16px;">
                            <div style="background: #f5faff; border: 1px solid #d6e8ff; border-radius: 12px; padding: 16px;">
                                <h3 style="margin-top: 0; color: #1890ff;">AHE 密钥生成</h3>
                                <button id="btnInitParams" class="btn-primary" style="margin-right: 8px;">参数初始化</button>
                                <button id="btnDownloadPubKey" class="btn-secondary" disabled>下载公钥</button>
                                <button id="btnDownloadPriKey" class="btn-secondary" disabled style="margin-left: 8px;">下载私钥</button>
                                <p id="keyStatus" style="color: #8c8c8c; margin: 12px 0 0;">尚未初始化</p>
                            </div>
                            <div style="background: #f6ffed; border: 1px solid #d9f7be; border-radius: 12px; padding: 16px;">
                                <h3 style="margin-top: 0; color: #389e0d;">预计算表</h3>
                                <button id="btnGetPrecompute" class="btn-primary" disabled>获取预计算表</button>
                                <p id="tableStatus" style="color: #8c8c8c; margin: 12px 0 0;">等待密钥初始化后生成</p>
                            </div>
                        </div>
                    </div>

                    <div class="tech-card" style="border-radius: 16px; padding: 24px; margin-bottom: 24px;">
                        <h2 style="color: #096dd9; margin-bottom: 16px;">2. 新建任务数据配置</h2>
                        <p style="margin: 0 0 14px; color: #8c8c8c;">
                            数据源配置、隐私保护参数与图像精度预处理已归并至新建任务页面。
                        </p>
                        <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
                            <a href="../pages/model-center.html" class="btn-secondary" style="text-decoration: none;">前往模型中心</a>
                            <a href="../pages/data-config.html" class="btn-primary" style="text-decoration: none;">前往新建任务（数据配置）</a>
                            <a href="../pages/task-dashboard.html" class="btn-secondary" style="text-decoration: none;">查看任务监控</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="../js/app.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const state = {
            publicKey: "",
            privateKey: "",
            precomputeTable: ""
        };

        function downloadTextFile(fileName, content) {
            const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
            const href = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = href;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(href);
        }

        document.getElementById("btnInitParams").addEventListener("click", function() {
            const stamp = Date.now();
            state.publicKey = "AHE-PUB-" + stamp + "-MOCK";
            state.privateKey = "AHE-PRI-" + stamp + "-MOCK";
            document.getElementById("keyStatus").textContent = "已生成 AHE 公私钥（Mock，参考论文流程）。";
            document.getElementById("btnDownloadPubKey").disabled = false;
            document.getElementById("btnDownloadPriKey").disabled = false;
            document.getElementById("btnGetPrecompute").disabled = false;
        });

        document.getElementById("btnDownloadPubKey").addEventListener("click", function() {
            downloadTextFile("ahe_public_key.txt", state.publicKey || "EMPTY");
        });

        document.getElementById("btnDownloadPriKey").addEventListener("click", function() {
            downloadTextFile("ahe_private_key.txt", state.privateKey || "EMPTY");
        });

        document.getElementById("btnGetPrecompute").addEventListener("click", function() {
            state.precomputeTable = JSON.stringify({
                keyRef: state.publicKey,
                tableName: "ahe_precompute_table",
                generatedAt: new Date().toISOString(),
                note: "Mock 预计算表，后续可替换为真实后端接口返回"
            }, null, 2);
            document.getElementById("tableStatus").textContent = "预计算表已生成，可下载保存到本地文件。";
            downloadTextFile("ahe_precompute_table.json", state.precomputeTable);
        });

        // 保留科技感交互
        const cards = document.querySelectorAll('.tech-card');
        cards.forEach(card => {
            card.addEventListener('mouseenter', function() {
                this.style.transform = 'translateY(-2px)';
                this.style.boxShadow = '0 12px 32px rgba(24, 144, 255, 0.2)';
            });
            
            card.addEventListener('mouseleave', function() {
                this.style.transform = 'translateY(0)';
                this.style.boxShadow = '0 8px 32px rgba(0, 80, 179, 0.1)';
            });
        });
    });
    </script>
</body>
</html>
