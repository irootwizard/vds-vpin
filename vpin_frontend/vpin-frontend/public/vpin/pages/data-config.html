<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据配置 - VDS-VPIN</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/theme.css">
    <style>
        .data-source-options { grid-template-columns: 1fr !important; }
        .upload-area {
            padding: 40px 24px !important;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .upload-area.drag-over {
            border-color: var(--primary-color) !important;
            background: rgba(24, 144, 255, 0.05) !important;
        }
        .upload-area img { width: 52px; height: 52px; opacity: 0.45; margin-bottom: 12px; }
        .upload-area p { margin: 4px 0; font-size: 14px; }
        .upload-area .btn-outline { margin-top: 14px; }
        .file-list { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
        .file-item img { width: 20px; height: 20px; flex-shrink: 0; }
        .status-pending { color: #faad14; font-size: 12px; }
    </style>
</head>
<body>
    <div class="app-container">
        <div data-include="../components/header.html"></div>
        
        <div class="main-content">
            <div data-include="../components/sidebar.html"></div>
            
            <div class="content-wrapper">
                <div class="page-container">
                    <div class="page-header">
                        <h1>数据配置</h1>
                    </div>
                    
                    <!-- 步骤指示器 -->
                    <div class="step-indicator">
                        <div class="step active">
                            <div class="step-number">1</div>
                            <div class="step-label">选择数据源</div>
                        </div>
                        <div class="step active">
                            <div class="step-number">2</div>
                            <div class="step-label">隐私配置</div>
                        </div>
                        <div class="step">
                            <div class="step-number">3</div>
                            <div class="step-label">预览确认</div>
                        </div>
                    </div>
                    
                    <!-- 数据源选择 -->
                    <div class="config-section">
                        <h2 class="section-title">
                            <img src="../assets/icons/database.svg" alt="数据源">
                            选择数据源
                        </h2>
                        
                        <div class="data-source-options">
                            <div class="source-option active">
                                <div class="option-header">
                                    <img src="../assets/icons/upload.svg" alt="上传">
                                    <h3>上传本地文件</h3>
                                </div>
                                <div class="option-body">
                                    <input type="file" id="fileInput" multiple accept=".csv,.json,.parquet" style="display:none;">
                                    <div class="upload-area" id="uploadArea">
                                        <img src="../assets/icons/folder.svg" alt="文件夹">
                                        <p>拖拽文件到此处，或点击选择</p>
                                        <p class="upload-hint">支持 .csv、.json、.parquet 格式，最大 10GB</p>
                                        <button class="btn-outline" id="selectFileBtn" type="button">选择文件</button>
                                    </div>
                                    <div class="file-list" id="fileList"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 图像精度预处理 -->
                    <div class="config-section">
                        <h2 class="section-title">
                            <img src="../assets/icons/upload.svg" alt="图像精度">
                            图像精度预处理
                        </h2>
                        <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
                            <label for="imageInput">上传图像</label>
                            <input id="imageInput" type="file" accept="image/*">
                            <label for="precisionBits">浮点转定点精度（小数位）</label>
                            <input id="precisionBits" type="number" min="0" max="8" value="4" style="width: 80px;">
                            <button id="btnInitPreprocess" class="btn-primary">初始化并预处理（AHE）</button>
                            <button id="btnPreviewCompare" class="btn-secondary" disabled>查看精度对比</button>
                            <button id="btnConfirmPreprocess" class="btn-primary" disabled>确认</button>
                        </div>
                        <p id="preprocessStatus" style="margin: 12px 0 0; color: #8c8c8c;">等待图像与精度配置</p>
                    </div>
                    
                    <!-- 隐私配置 -->
                    <div class="config-section">
                        <h2 class="section-title">
                            <img src="../assets/icons/security.svg" alt="隐私">
                            隐私保护配置
                        </h2>
                        
                        <div class="privacy-config">
                            <!-- 全局设置 -->
                            <div class="privacy-global">
                                <h3>全局安全设置</h3>
                                <div class="toggle-group">
                                    <div class="toggle-item">
                                        <label class="toggle-label">
                                            <input type="checkbox" checked>
                                            <span class="toggle-slider"></span>
                                            <span class="toggle-text">
                                                <img src="../assets/icons/encryption.svg" alt="加密">
                                                启用端到端加密
                                            </span>
                                        </label>
                                        <div class="toggle-description">
                                            所有数据在传输和存储过程中进行加密
                                        </div>
                                    </div>
                                    
                                    <div class="toggle-item">
                                        <label class="toggle-label">
                                            <input type="checkbox" checked>
                                            <span class="toggle-slider"></span>
                                            <span class="toggle-text">
                                                <img src="../assets/icons/access-control.svg" alt="访问控制">
                                                启用访问控制
                                            </span>
                                        </label>
                                        <div class="toggle-description">
                                            基于角色的数据访问权限管理
                                        </div>
                                    </div>
                                    
                                    <div class="toggle-item">
                                        <label class="toggle-label">
                                            <input type="checkbox">
                                            <span class="toggle-slider"></span>
                                            <span class="toggle-text">
                                                <img src="../assets/icons/dp.svg" alt="差分隐私">
                                                启用本地差分隐私
                                            </span>
                                        </label>
                                        <div class="toggle-description">
                                            在数据源头添加噪声保护隐私
                                            <button class="btn-link">配置参数</button>
                                        </div>
                                    </div>

                                    <div class="toggle-item">
                                        <label class="toggle-label">
                                            <input id="privacyAhe" type="checkbox" checked>
                                            <span class="toggle-slider"></span>
                                            <span class="toggle-text">
                                                <img src="../assets/icons/encryption.svg" alt="AHE">
                                                启用 AHE 同态加密
                                            </span>
                                        </label>
                                        <div class="toggle-description">
                                            用于推理过程中的同态密文计算，可与 CP-SNARK 同时启用。
                                        </div>
                                    </div>

                                    <div class="toggle-item">
                                        <label class="toggle-label">
                                            <input id="privacySnark" type="checkbox" checked>
                                            <span class="toggle-slider"></span>
                                            <span class="toggle-text">
                                                <img src="../assets/icons/verification.svg" alt="CP-SNARK">
                                                启用 CP-SNARK 零知识证明
                                            </span>
                                        </label>
                                        <div class="toggle-description">
                                            提供结果可验证性证明，可与 AHE 多选组合。
                                        </div>
                                    </div>
                                </div>
                                <p id="privacyProtocolStatus" style="margin-top: 12px; color:#8c8c8c;">
                                    当前隐私机制：AHE 同态加密、CP-SNARK 零知识证明
                                </p>
                            </div>
                            
                        </div>
                    </div>
                    
                    <!-- 操作按钮 -->
                    <div class="action-bar">
                        <button class="btn-primary">
                            下一步：预览确认
                            <img src="../assets/icons/chevron-right.svg" alt="下一步">
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="../js/app.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // ── 文件上传 ──────────────────────────────────────────────
        const fileInput    = document.getElementById('fileInput');
        const uploadArea   = document.getElementById('uploadArea');
        const fileList     = document.getElementById('fileList');
        const selectFileBtn = document.getElementById('selectFileBtn');
        const ALLOWED_EXT  = ['.csv', '.json', '.parquet'];
        let uploadedFiles  = [];

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            if (bytes < 1024 * 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + ' MB';
            return (bytes / 1024 / 1024 / 1024).toFixed(2) + ' GB';
        }

        function iconFor(name) {
            const ext = name.split('.').pop().toLowerCase();
            return ext === 'csv' ? '../assets/icons/file-csv.svg' : '../assets/icons/database.svg';
        }

        function renderFileList() {
            fileList.innerHTML = uploadedFiles.map(function(f, i) {
                return '<div class="file-item">' +
                    '<img src="' + iconFor(f.name) + '" alt="">' +
                    '<div class="file-info">' +
                        '<div class="file-name">' + f.name + '</div>' +
                        '<div class="file-size">' + formatSize(f.size) + '</div>' +
                    '</div>' +
                    '<div class="file-status">' +
                        '<span class="status-success">已选择</span>' +
                        '<button class="btn-icon" type="button" data-idx="' + i + '">' +
                            '<img src="../assets/icons/delete.svg" alt="删除">' +
                        '</button>' +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function addFiles(files) {
            Array.from(files).forEach(function(f) {
                var ext = '.' + f.name.split('.').pop().toLowerCase();
                if (!ALLOWED_EXT.includes(ext)) return;
                if (!uploadedFiles.some(function(u) { return u.name === f.name && u.size === f.size; })) {
                    uploadedFiles.push(f);
                }
            });
            renderFileList();
        }

        fileList.addEventListener('click', function(e) {
            var btn = e.target.closest('[data-idx]');
            if (!btn) return;
            uploadedFiles.splice(Number(btn.dataset.idx), 1);
            renderFileList();
        });

        selectFileBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            fileInput.click();
        });

        uploadArea.addEventListener('click', function() { fileInput.click(); });

        fileInput.addEventListener('change', function() {
            addFiles(this.files);
            this.value = '';
        });

        uploadArea.addEventListener('dragover', function(e) {
            e.preventDefault();
            this.classList.add('drag-over');
        });

        uploadArea.addEventListener('dragleave', function() {
            this.classList.remove('drag-over');
        });

        uploadArea.addEventListener('drop', function(e) {
            e.preventDefault();
            this.classList.remove('drag-over');
            addFiles(e.dataTransfer.files);
        });

        // ── 图像精度预处理 ────────────────────────────────────────
        const state = {
            hasPreprocessedImage: false
        };
        const privacyStorageKey = "vpinPrivacyProtocols";

        document.getElementById("btnInitPreprocess").addEventListener("click", function() {
            const imageInput = document.getElementById("imageInput");
            const precisionBits = Number(document.getElementById("precisionBits").value);
            if (!imageInput.files || imageInput.files.length === 0) {
                document.getElementById("preprocessStatus").textContent = "请先上传图像。";
                return;
            }
            state.hasPreprocessedImage = true;
            document.getElementById("preprocessStatus").textContent =
                "已完成图像浮点精度(" + precisionBits + "位)转定点并执行 AHE 预处理（Mock）。";
            document.getElementById("btnPreviewCompare").disabled = false;
            document.getElementById("btnConfirmPreprocess").disabled = false;
        });

        document.getElementById("btnPreviewCompare").addEventListener("click", function() {
            if (!state.hasPreprocessedImage) {
                return;
            }
            const imageInput = document.getElementById("imageInput");
            const file = imageInput.files[0];
            const precisionBits = document.getElementById("precisionBits").value;
            const reader = new FileReader();
            reader.onload = function(e) {
                const previewWindow = window.open("", "_blank", "width=900,height=600");
                if (!previewWindow) {
                    document.getElementById("preprocessStatus").textContent = "浏览器阻止了弹窗，请允许后重试。";
                    return;
                }
                previewWindow.document.write(
                    "<!DOCTYPE html><html><head><meta charset='UTF-8'><title>图像精度对比</title></head><body style='font-family:Arial,sans-serif;background:#f5faff;padding:24px;'>" +
                    "<h2 style='color:#096dd9;'>图像精度对比窗口</h2>" +
                    "<p>原始图像与定点精度处理结果（模拟展示，精度位数：" + precisionBits + "）</p>" +
                    "<div style='display:flex;gap:24px;'>" +
                    "<div><h3>原始图像</h3><img src='" + e.target.result + "' style='max-width:360px;border:1px solid #d9d9d9;'/></div>" +
                    "<div><h3>定点精度后图像（Mock）</h3><img src='" + e.target.result + "' style='max-width:360px;border:1px solid #d9d9d9;filter: contrast(1.05) saturate(0.9);'/></div>" +
                    "</div>" +
                    "</body></html>"
                );
                previewWindow.document.close();
            };
            reader.readAsDataURL(file);
        });

        document.getElementById("btnConfirmPreprocess").addEventListener("click", function() {
            if (!state.hasPreprocessedImage) {
                return;
            }
            document.getElementById("preprocessStatus").textContent = "图像精度处理结果已确认，可进入下一步预览确认。";
        });

        const privacyAhe = document.getElementById("privacyAhe");
        const privacySnark = document.getElementById("privacySnark");
        const privacyProtocolStatus = document.getElementById("privacyProtocolStatus");

        function renderPrivacyProtocolStatus() {
            const selected = [];
            if (privacyAhe.checked) {
                selected.push("AHE 同态加密");
            }
            if (privacySnark.checked) {
                selected.push("CP-SNARK 零知识证明");
            }
            privacyProtocolStatus.textContent = selected.length > 0
                ? ("当前隐私机制：" + selected.join("、"))
                : "当前隐私机制：未启用（建议至少启用一种）";
        }

        function loadPrivacyProtocolSelection() {
            const raw = localStorage.getItem(privacyStorageKey);
            if (!raw) {
                renderPrivacyProtocolStatus();
                return;
            }
            try {
                const parsed = JSON.parse(raw);
                privacyAhe.checked = !!parsed.ahe;
                privacySnark.checked = !!parsed.snark;
            } catch (error) {
                // ignore parse error and use default selection
            }
            renderPrivacyProtocolStatus();
        }

        function persistPrivacyProtocolSelection() {
            localStorage.setItem(privacyStorageKey, JSON.stringify({
                ahe: privacyAhe.checked,
                snark: privacySnark.checked
            }));
            renderPrivacyProtocolStatus();
        }

        [privacyAhe, privacySnark].forEach(item => {
            item.addEventListener("change", persistPrivacyProtocolSelection);
        });

        loadPrivacyProtocolSelection();
    });
    </script>
</body>
</html>
