<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隐私预算 - VDS-VPIN</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <style>
        /* 与模型中心保持相同样式 */
        .page-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .page-actions button {
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 16px;
        }
        
        /* 仪表盘样式 */
        .dashboard-cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
            margin-bottom: 32px;
        }
        
        .budget-card {
            background: white;
            border: 1px solid #f0f0f0;
            border-radius: 12px;
            padding: 24px;
        }
        
        .budget-card.wide {
            grid-column: span 2;
        }
        
        .budget-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .budget-title {
            font-size: 16px;
            font-weight: 600;
            color: #262626;
        }
        
        /* 进度条样式 */
        .budget-progress {
            margin: 24px 0;
        }
        
        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        
        .progress-label {
            color: #595959;
            font-size: 14px;
        }
        
        .progress-value {
            color: #262626;
            font-weight: 600;
        }
        
        .progress-bar-container {
            height: 8px;
            background: #f5f5f5;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        
        .progress-bar.safe {
            background: linear-gradient(90deg, #52c41a, #73d13d);
        }
        
        .progress-bar.warning {
            background: linear-gradient(90deg, #faad14, #ffc53d);
        }
        
        .progress-bar.danger {
            background: linear-gradient(90deg, #ff4d4f, #ff7875);
        }
        
        /* 使用量图表 */
        .usage-chart {
            height: 200px;
            background: #fafafa;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #bfbfbf;
            margin: 20px 0;
        }
        
        /* 配置表单样式 */
        .config-form {
            background: white;
            border: 1px solid #f0f0f0;
            border-radius: 12px;
            padding: 24px;
            margin-top: 32px;
        }
        
        .form-section {
            margin-bottom: 32px;
        }
        
        .form-section:last-child {
            margin-bottom: 0;
        }
        
        .form-section-title {
            font-size: 16px;
            font-weight: 600;
            color: #262626;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 16px;
        }
        
        /* 预算标签 */
        .budget-tag {
            display: inline-flex;
            align-items: center;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            margin-right: 8px;
            margin-bottom: 8px;
        }
        
        .tag-weekly {
            background: rgba(24, 144, 255, 0.1);
            color: #1890ff;
        }
        
        .tag-monthly {
            background: rgba(114, 46, 209, 0.1);
            color: #722ed1;
        }
        
        .tag-quarterly {
            background: rgba(82, 196, 26, 0.1);
            color: #52c41a;
        }
        
        /* 任务列表 */
        .task-usage-list {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .usage-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f5f5f5;
        }
        
        .usage-item:last-child {
            border-bottom: none;
        }
        
        .usage-task {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .usage-amount {
            font-weight: 600;
            color: #262626;
        }
        
        .usage-time {
            color: #8c8c8c;
            font-size: 12px;
        }
        
        /* 预警样式 */
        .alert-config {
            background: #fff7e6;
            border: 1px solid #ffd591;
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
        }
        
        .alert-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div data-include="../components/header.html"></div>
        
        <div class="main-content">
            <!-- 这里添加侧边栏 -->
            <div data-include="../components/sidebar.html"></div>
            
            <div class="content-wrapper">
                <div class="page-container">
                    <!-- 页面头部 -->
                    <div class="page-header">
                        <div class="page-title">
                            <h1>隐私预算</h1>
                            <p>差分隐私预算管理与使用监控</p>
                        </div>
                        
                        <div class="page-actions">
                            <button class="btn-primary" onclick="resetBudget()">
                                <img src="../assets/icons/clock.svg" alt="重置">
                                重置预算
                            </button>
                            <button class="btn-secondary" onclick="exportBudgetReport()">
                                <img src="../assets/icons/download.svg" alt="导出">
                                导出报告
                            </button>
                        </div>
                    </div>
                    
                    <!-- 预算概览仪表盘 -->
                    <div class="dashboard-cards">
                        <!-- 总预算卡片 -->
                        <div class="budget-card">
                            <div class="budget-header">
                                <div class="budget-title">总预算状态</div>
                            </div>
                            
                            <div class="budget-progress">
                                <div class="progress-info">
                                    <span class="progress-label">已使用</span>
                                    <span class="progress-value">42%</span>
                                </div>
                                <div class="progress-bar-container">
                                    <div class="progress-bar safe" id="totalProgress" style="width: 42%"></div>
                                </div>
                                <div style="display: flex; justify-content: space-between; margin-top: 4px;">
                                    <span style="color: #8c8c8c; font-size: 12px;">0</span>
                                    <span style="color: #8c8c8c; font-size: 12px;">100%</span>
                                </div>
                            </div>
                            
                            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 24px;">
                                <div>
                                    <div style="font-size: 24px; font-weight: 700; color: #1890ff;">€ 8,500</div>
                                    <div style="color: #595959; font-size: 12px;">已使用预算</div>
                                </div>
                                <div>
                                    <div style="font-size: 24px; font-weight: 700; color: #52c41a;">€ 11,500</div>
                                    <div style="color: #595959; font-size: 12px;">剩余预算</div>
                                </div>
                            </div>
                        </div> 
                    </div>
                    
                    <!-- 任务使用详情 -->
                    <div class="budget-card wide">
                        <div class="budget-header">
                            <div class="budget-title">任务预算使用详情</div>
                            <div class="search-box" style="width: 200px;">
                                <span style="display: inline-block; width: 16px; height: 16px; margin-right: 8px; position: relative;">
                                    <span style="position: absolute; width: 10px; height: 10px; border: 2px solid #bfbfbf; border-radius: 50%; top: 0; left: 0;"></span>
                                    <span style="position: absolute; width: 6px; height: 2px; background: #bfbfbf; transform: rotate(45deg); bottom: 1px; right: -1px;"></span>
                                </span>
                            </div>
                        </div>
                        
                        <div class="task-usage-list">
                            <div class="usage-item">
                                <div class="usage-task">
                                    <div style="width: 32px; height: 32px; background: rgba(24, 144, 255, 0.1); border-radius: 6px; display: flex; align-items: center; justify-content: center;">
                                        <img src="../assets/icons/model-xgboost.svg" alt="模型" style="width: 16px; height: 16px;">
                                    </div>
                                    <div>
                                        <div style="font-weight: 600; color: #262626;">TASK-2024-0015</div>
                                        <div style="color: #595959; font-size: 12px;">金融风险评估</div>
                                    </div>
                                </div>
                                <div style="text-align: right;">
                                    <div class="usage-amount">€ 1,250</div>
                                    <div class="usage-time">今天 14:30</div>
                                </div>
                            </div>
                            
                            <div class="usage-item">
                                <div class="usage-task">
                                    <div style="width: 32px; height: 32px; background: rgba(114, 46, 209, 0.1); border-radius: 6px; display: flex; align-items: center; justify-content: center;">
                                        <img src="../assets/icons/model-cnn.svg" alt="模型" style="width: 16px; height: 16px;">
                                    </div>
                                    <div>
                                        <div style="font-weight: 600; color: #262626;">TASK-2024-0014</div>
                                        <div style="color: #595959; font-size: 12px;">医疗数据分析</div>
                                    </div>
                                </div>
                                <div style="text-align: right;">
                                    <div class="usage-amount">€ 950</div>
                                    <div class="usage-time">今天 11:15</div>
                                </div>
                            </div>
                            
                            <div class="usage-item">
                                <div class="usage-task">
                                    <div style="width: 32px; height: 32px; background: rgba(82, 196, 26, 0.1); border-radius: 6px; display: flex; align-items: center; justify-content: center;">
                                        <img src="../assets/icons/model-nlp.svg" alt="模型" style="width: 16px; height: 16px;">
                                    </div>
                                    <div>
                                        <div style="font-weight: 600; color: #262626;">TASK-2024-0013</div>
                                        <div style="color: #595959; font-size: 12px;">情感分析</div>
                                    </div>
                                </div>
                                <div style="text-align: right;">
                                    <div class="usage-amount">€ 720</div>
                                    <div class="usage-time">今天 09:45</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    
                </div>
            </div>
        </div>
    </div>
    
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // HTML包含功能
        document.querySelectorAll('[data-include]').forEach(function(element) {
            const file = element.getAttribute('data-include');
            fetch(file)
                .then(response => response.text())
                .then(data => {
                    element.innerHTML = data;
                });
        });
        
        // 搜索功能
        document.getElementById('taskSearch')?.addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            const items = document.querySelectorAll('.usage-item');
            
            items.forEach(item => {
                const text = item.textContent.toLowerCase();
                item.style.display = text.includes(searchTerm) ? '' : 'none';
            });
        });
    });
    
    function resetBudget() {
        if (confirm('确定要重置当前周期的预算吗？此操作不可撤销。')) {
            alert('预算重置成功！');
            // 实际实现中这里会有重置逻辑
        }
    }
    
    function exportBudgetReport() {
        alert('开始导出预算报告...');
        // 实际实现中这里会有导出逻辑
    }
    
    function changeTrendPeriod(period) {
        console.log('切换到时间段:', period);
        // 实际实现中这里会更新图表数据
    }
    
    function saveBudgetConfig() {
        alert('配置已保存！');
        // 实际实现中这里会有保存配置的逻辑
    }
    </script>
</body>
</html>
