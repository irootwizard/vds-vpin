[package]
name = "cp-snark-full"
version = "0.1.0"
edition = "2021"
description = "Full CP-SNARK protocol for vPIN computation proofs (model/input commitment, challenge, prove, verify)"

[[bin]]
name = "cp-snark-full"
path = "src/main.rs"

[lib]
name = "cp_snark_full"
path = "src/lib.rs"

[dependencies]
spartan = { path = "../proof_generation/Spartan", features = ["multicore"] }
curve25519-dalek = { version = "3.2.0", features = ["serde", "u64_backend", "alloc"], default-features = false }
merlin = { version = "3.0.0", default-features = false }
rand = { version = "0.7.3", features = ["getrandom"], default-features = false }
bincode = "1.3.3"
serde = { version = "1.0.164", features = ["derive"] }
serde_json = "1.0.96"
sha2 = "0.10.8"
hex = "0.4.3"
uint = "0.9.5"
num = "0.4"
