[package]
name = "ahe-crypto-e2-ec"
version.workspace = true
edition.workspace = true
description = "E2 curve stack via primefield + primeorder (independent of arkworks)"

[dependencies]
elliptic-curve = { version = "0.14", default-features = false, features = ["std", "dev", "sec1"] }
primefield = "0.14"
primeorder = { version = "0.14.0-rc.14", features = ["std", "dev", "basepoint-table"] }
crypto-bigint = { version = "0.6", default-features = false, features = ["rand"] }
memmap2.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
thiserror.workspace = true
subtle = "2.6"
wnaf = "0.14.0-rc.1"

[dev-dependencies]
serde_json.workspace = true
