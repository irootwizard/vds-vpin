[package]
name = "vpin-server-crypto"
version = "0.1.0"
edition = "2021"
description = "vPIN server-side CP-SNARK: commitments, EC gadgets, prove pipeline"

[[bin]]
name = "vpin-server-crypto"
path = "src/bin/cli.rs"

[lib]
name = "vpin_server_crypto"
path = "src/lib.rs"

[dependencies]
spartan = { path = "../../../src/proof_generation/Spartan" }
curve25519-dalek = { version = "3.2.0", features = ["serde", "u64_backend", "alloc"], default-features = false }
merlin = { version = "3.0.0", default-features = false }
rand = { version = "0.7.3", features = ["getrandom"], default-features = false }
serde = { version = "1.0.164", features = ["derive"] }
serde_json = "1.0.96"
hex = "0.4.3"
bincode = "1.3.3"
num = "0.4"
sha2 = "0.10.8"
