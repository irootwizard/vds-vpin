[package]
name = "ovds-server"
version = "0.1.0"
edition = "2021"
description = "OVDS standalone REST server (axum)"

[dependencies]
ovds-core = { path = "../../crates/ovds-core" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num-bigint = "0.4"
hex = "0.4"
sled = "0.34"
rayon = "1.8"
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"
