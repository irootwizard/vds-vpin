<div class="model-card">
    <div class="model-card-header">
        <div class="model-icon">
            <img src="../assets/icons/model-nlp.svg" alt="NLP模型">
        </div>
        <div class="model-meta">
            <h3>BERT情感分析</h3>
            <span class="model-version">v2.1</span>
        </div>
        <div class="model-actions">
            <button class="btn-icon">
                <img src="../assets/icons/more.svg" alt="更多">
            </button>
        </div>
    </div>
    
    <div class="model-card-body">
        <p class="model-description">
            基于BERT的情感分析模型，支持中文情感分类
        </p>
        
        <div class="model-stats">
            <div class="stat-item">
                <span class="stat-label">类型</span>
                <span class="stat-value">NLP分类</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">大小</span>
                <span class="stat-value">420MB</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">准确率</span>
                <span class="stat-value">94.2%</span>
            </div>
        </div>
        
        <div class="privacy-badges">
            <span class="badge badge-tee">
                <img src="../assets/icons/shield.svg" alt="保护">
                TEE保护
            </span>
            <span class="badge badge-dp">
                <img src="../assets/icons/lock.svg" alt="隐私">
                差分隐私
            </span>
        </div>
        
        <div class="performance-indicator">
            <span class="perf-label">预估耗时：</span>
            <div class="perf-bar">
                <div class="perf-fill" style="width: 30%"></div>
            </div>
            <span class="perf-time">~2分钟</span>
        </div>
    </div>
    
    <div class="model-card-footer">
        <button class="btn-secondary btn-sm">查看详情</button>
        <button class="btn-primary btn-sm">选择使用</button>
    </div>
</div>
