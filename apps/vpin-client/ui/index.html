<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VDS-VPIN 工作台</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #f0f8ff 0%, #e6f7ff 50%, #d0e8ff 100%);
        }

        .tech-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(24, 144, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 80, 179, 0.1);
        }

        .glow-effect {
            position: relative;
        }

        .glow-effect::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: var(--border-radius-lg);
            background: linear-gradient(135deg, rgba(24, 144, 255, 0.2), transparent);
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .glow-effect:hover::before {
            opacity: 1;
        }

        .blue-text {
            color: #1890ff;
        }
    </style>
</head>
<body>
    <div class="app-container gradient-bg">
        <!-- Header组件占位 -->
        <div id="header-container"></div>

        <div class="main-content">
            <!-- Sidebar组件占位 -->
            <div id="sidebar-container"></div>

            <div class="content-wrapper">
                <div class="page-container">
                    <!-- 欢迎区域 -->
                    <div class="welcome-section tech-card" style="border-radius: 16px; margin-bottom: 32px; padding: 32px;">
                        <h1 style="font-size: 32px; font-weight: 700; color: #096dd9; margin-bottom: 8px;">
                            VDS-VPIN 工作台
                        </h1>
                        <div class="system-status" style="display: flex; align-items: center; gap: 12px;">
                            <span class="pulse-dot"></span>
                            <span id="systemStatus" style="color: #1890ff;">运行中</span>
                        </div>
                    </div>

                    <!-- 统计数据卡片组 -->
                    <div class="page-stats" style="margin-bottom: 32px;">
                        <div class="stat-card tech-card glow-effect" style="border: 1px solid rgba(24, 144, 255, 0.3);">
                            <div class="stat-icon running" style="background: rgba(24, 144, 255, 0.1);">
                                <img src="assets/icons/activity.svg" alt="运行中" style="filter: invert(35%) sepia(91%) saturate(2476%) hue-rotate(195deg) brightness(98%) contrast(101%);">
                            </div>
                            <div class="stat-content">
                                <div class="stat-value blue-text" id="runningCount">0</div>
                                <div class="stat-label blue-text">运行中</div>
                            </div>
                        </div>

                        <div class="stat-card tech-card glow-effect" style="border: 1px solid rgba(250, 173, 20, 0.3);">
                            <div class="stat-icon queued" style="background: rgba(250, 173, 20, 0.1);">
                                <img src="assets/icons/clock.svg" alt="排队中" style="filter: invert(65%) sepia(86%) saturate(425%) hue-rotate(350deg) brightness(99%) contrast(98%);">
                            </div>
                            <div class="stat-content">
                                <div class="stat-value" style="color: #d48806;" id="queuedCount">0</div>
                                <div class="stat-label" style="color: #faad14;">排队中</div>
                            </div>
                        </div>

                        <div class="stat-card tech-card glow-effect" style="border: 1px solid rgba(82, 196, 26, 0.3);">
                            <div class="stat-icon success" style="background: rgba(82, 196, 26, 0.1);">
                                <img src="assets/icons/check-circle.svg" alt="已完成" style="filter: invert(61%) sepia(95%) saturate(365%) hue-rotate(60deg) brightness(91%) contrast(89%);">
                            </div>
                            <div class="stat-content">
                                <div class="stat-value" style="color: #389e0d;" id="completedCount">0</div>
                                <div class="stat-label" style="color: #52c41a;">已完成</div>
                            </div>
                        </div>

                        <div class="stat-card tech-card glow-effect" style="border: 1px solid rgba(255, 77, 79, 0.3);">
                            <div class="stat-icon failed" style="background: rgba(255, 77, 79, 0.1);">
                                <img src="assets/icons/alert.svg" alt="失败" style="filter: invert(39%) sepia(91%) saturate(7483%) hue-rotate(347deg) brightness(99%) contrast(105%);">
                            </div>
                            <div class="stat-content">
                                <div class="stat-value" style="color: #cf1322;" id="failedCount">0</div>
                                <div class="stat-label" style="color: #ff4d4f;">失败</div>
                            </div>
                        </div>
                    </div>

                    <!-- 快速操作区域 -->
                    <div class="quick-actions" style="margin-bottom: 32px;">
                        <button class="btn-primary tech-card glow-effect tauri-action" data-action="select-model"
                           style="background: linear-gradient(135deg, #1890ff, #096dd9);
                                  border: none; padding: 16px 24px; border-radius: 12px;
                                  box-shadow: 0 4px 16px rgba(24, 144, 255, 0.3); cursor: pointer;">
                            <img src="assets/icons/folder.svg" alt="模型" style="width: 20px; height: 20px; filter: brightness(0) invert(1);">
                            <span style="font-weight: 600; color: white;">选择模型</span>
                        </button>
                        <button class="btn-primary tech-card glow-effect tauri-action" data-action="upload-data"
                           style="background: linear-gradient(135deg, #52c41a, #389e0d);
                                  border: none; padding: 16px 24px; border-radius: 12px;
                                  box-shadow: 0 4px 16px rgba(82, 196, 26, 0.3); cursor: pointer;">
                            <img src="assets/icons/upload.svg" alt="上传" style="width: 20px; height: 20px; filter: brightness(0) invert(1);">
                            <span style="font-weight: 600; color: white;">上传数据</span>
                        </button>
                        <button class="btn-primary tech-card glow-effect tauri-action" data-action="view-tasks"
                           style="background: linear-gradient(135deg, #722ed1, #531dab);
                                  border: none; padding: 16px 24px; border-radius: 12px;
                                  box-shadow: 0 4px 16px rgba(114, 46, 209, 0.3); cursor: pointer;">
                            <img src="assets/icons/activity.svg" alt="监控" style="width: 20px; height: 20px; filter: brightness(0) invert(1);">
                            <span style="font-weight: 600; color: white;">查看任务</span>
                        </button>
                    </div>

                    <!-- 最近任务 -->
                    <div class="tech-card" style="border-radius: 16px; padding: 24px;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                            <h2 style="color: #096dd9; display: flex; align-items: center; gap: 12px;">
                                <img src="assets/icons/activity.svg" alt="任务" style="filter: invert(35%) sepia(91%) saturate(2476%) hue-rotate(195deg) brightness(98%) contrast(101%);">
                                最近任务
                            </h2>
                            <button id="viewAllTasks" style="color: #1890ff; background: none; border: none; cursor: pointer; font-size: 14px; font-weight: 500;">
                                查看全部 →
                            </button>
                        </div>

                        <div id="taskList" class="task-list" style="background: #fafafa; border: 1px solid #e8e8e8; border-radius: 12px; overflow: hidden;">
                            <!-- 任务列表将通过JavaScript动态加载 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/tauri-api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
