<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vPIN Client</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 600px;
            width: 90%;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .status {
            padding: 12px 20px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .status.disconnected {
            background: #fee;
            color: #c33;
        }
        .status.connected {
            background: #efe;
            color: #3c3;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        .buttons {
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        button.primary {
            background: #667eea;
            color: white;
        }
        button.primary:hover {
            background: #5568d3;
        }
        button.secondary {
            background: #f0f0f0;
            color: #333;
        }
        button.secondary:hover {
            background: #e0e0e0;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 6px;
            font-size: 13px;
            color: #555;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .result:empty {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>vPIN Client</h1>
        <p class="subtitle">可验证的隐私神经网络推理服务</p>

        <div id="status" class="status disconnected">
            ● 未连接到服务器
        </div>

        <div class="input-group">
            <label for="serverUrl">服务器地址</label>
            <input type="text" id="serverUrl" value="http://127.0.0.1:8000" />
        </div>

        <div class="buttons">
            <button class="primary" onclick="checkHealth()">健康检查</button>
            <button class="secondary" onclick="saveUrl()">保存地址</button>
        </div>

        <div id="result" class="result"></div>
    </div>

    <script>
        const { invoke } = window.__TAURI__.core;

        async function checkHealth() {
            const result = document.getElementById('result');
            const status = document.getElementById('status');

            result.textContent = '正在检查...';

            try {
                const response = await invoke('health_check');
                result.textContent = '服务器响应:\n' + response;
                status.className = 'status connected';
                status.textContent = '● 已连接';
            } catch (error) {
                result.textContent = '错误: ' + error;
                status.className = 'status disconnected';
                status.textContent = '● 连接失败';
            }
        }

        async function saveUrl() {
            const url = document.getElementById('serverUrl').value;
            try {
                await invoke('set_server_url', { url });
                document.getElementById('result').textContent = '服务器地址已保存';
            } catch (error) {
                document.getElementById('result').textContent = '保存失败: ' + error;
            }
        }

        window.onload = async function() {
            try {
                const url = await invoke('get_server_url');
                document.getElementById('serverUrl').value = url;
            } catch (error) {
                console.error('Failed to load server URL:', error);
            }
        };
    </script>
</body>
</html>
