<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务监控 - VDS-VPIN</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="app-container">
        <div id="header-container"></div>

        <div class="main-content">
            <div id="sidebar-container"></div>

            <div class="content-wrapper">
                <div class="page-container">
                    <div class="page-header">
                        <div class="page-title">
                            <h1>任务监控</h1>
                            <p>实时监控隐私计算任务状态与资源使用</p>
                        </div>

                        <div class="page-stats">
                            <div class="stat-card">
                                <div class="stat-icon running">
                                    <img src="assets/icons/activity.svg" alt="运行中">
                                </div>
                                <div class="stat-content">
                                    <div class="stat-value" id="runningTasks">0</div>
                                    <div class="stat-label">运行中</div>
                                </div>
                            </div>

                            <div class="stat-card">
                                <div class="stat-icon queued">
                                    <img src="assets/icons/clock.svg" alt="排队中">
                                </div>
                                <div class="stat-content">
                                    <div class="stat-value" id="queuedTasks">0</div>
                                    <div class="stat-label">排队中</div>
                                </div>
                            </div>

                            <div class="stat-card">
                                <div class="stat-icon success">
                                    <img src="assets/icons/check-circle.svg" alt="已完成">
                                </div>
                                <div class="stat-content">
                                    <div class="stat-value" id="completedTasks">0</div>
                                    <div class="stat-label">已完成</div>
                                </div>
                            </div>

                            <div class="stat-card">
                                <div class="stat-icon failed">
                                    <img src="assets/icons/alert.svg" alt="失败">
                                </div>
                                <div class="stat-content">
                                    <div class="stat-value" id="failedTasks">0</div>
                                    <div class="stat-label">失败</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 快速操作 -->
                    <div class="quick-actions">
                        <button class="btn-primary tauri-action" data-action="create-task">
                            <img src="assets/icons/plus.svg" alt="新建">
                            新建任务
                        </button>
                        <button class="btn-secondary" onclick="window.app.filterTasks()">
                            <img src="assets/icons/filter.svg" alt="筛选">
                            筛选
                        </button>
                        <button class="btn-secondary" onclick="window.app.exportReport()">
                            <img src="assets/icons/download.svg" alt="导出">
                            导出报告
                        </button>
                    </div>

                    <!-- 实时监控面板 -->
                    <div class="monitoring-panel">
                        <div class="panel-section">
                            <h2 class="section-title">
                                <img src="assets/icons/activity.svg" alt="任务">
                                任务队列
                            </h2>

                            <div class="task-queue">
                                <div id="realTimeTaskList" class="task-list">
                                    <!-- 任务列表通过JavaScript动态加载 -->
                                </div>
                            </div>
                        </div>

                        <div class="panel-section">
                            <h2 class="section-title">
                                <img src="assets/icons/bar-chart.svg" alt="监控">
                                资源监控
                            </h2>

                            <div class="resource-monitor">
                                <div class="resource-charts">
                                    <div class="chart-container">
                                        <div class="chart-header">
                                            <h4>CPU使用率</h4>
                                            <span class="chart-value" id="cpuUsage">--%</span>
                                        </div>
                                        <div class="chart-body">
                                            <div class="progress-chart">
                                                <div class="progress-bar-chart" id="cpuBar" style="width: 0%"></div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="chart-container">
                                        <div class="chart-header">
                                            <h4>内存使用</h4>
                                            <span class="chart-value" id="memoryUsage">--/--</span>
                                        </div>
                                        <div class="chart-body">
                                            <div class="progress-chart">
                                                <div class="progress-bar-chart" id="memoryBar" style="width: 0%"></div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="chart-container">
                                        <div class="chart-header">
                                            <h4>网络I/O</h4>
                                            <span class="chart-value" id="networkIO">-- MB/s</span>
                                        </div>
                                        <div class="chart-body">
                                            <div class="progress-chart">
                                                <div class="progress-bar-chart" id="networkBar" style="width: 0%"></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 安全运行状态面板 -->
                    <div class="security-panel">
                        <h2 class="section-title">
                            <img src="assets/icons/lock-check.svg" alt="安全">
                            安全运行状态
                        </h2>

                        <div class="security-status-grid">
                            <div class="status-card secure">
                                <div class="status-icon">
                                    <img src="assets/icons/lock-check.svg" alt="TEE">
                                </div>
                                <div class="status-content">
                                    <h3>客户端密钥保护</h3>
                                    <p>私钥安全存储在本地Tauri环境中</p>
                                    <div class="status-details">
                                        <span class="detail-item">
                                            <img src="assets/icons/check.svg" alt="通过">
                                            本地密钥管理: 启用
                                        </span>
                                        <span class="detail-item">
                                            <img src="assets/icons/check.svg" alt="通过">
                                            密钥隔离: 启用
                                        </span>
                                    </div>
                                </div>
                            </div>

                            <div class="status-card secure">
                                <div class="status-icon">
                                    <img src="assets/icons/encryption.svg" alt="加密">
                                </div>
                                <div class="status-content">
                                    <h3>加密通信</h3>
                                    <p>端到端TLS 1.3加密通道</p>
                                    <div class="status-details">
                                        <span class="detail-item">
                                            <img src="assets/icons/check.svg" alt="通过">
                                            安全传输: 启用
                                        </span>
                                        <span class="detail-item">
                                            <img src="assets/icons/check.svg" alt="通过">
                                            证书验证: 启用
                                        </span>
                                    </div>
                                </div>
                            </div>

                            <div class="status-card info">
                                <div class="status-icon">
                                    <img src="assets/icons/audit.svg" alt="验证">
                                </div>
                                <div class="status-content">
                                    <h3>CP-SNARK验证</h3>
                                    <p>计算量证明验证状态</p>
                                    <div class="status-details">
                                        <span class="detail-item">
                                            <img src="assets/icons/check.svg" alt="通过">
                                            验证模块: 就绪
                                        </span>
                                        <button class="btn-link" onclick="window.app.viewVerificationLog()">查看日志</button>
                                    </div>
                                </div>
                            </div>

                            <div class="status-card info">
                                <div class="status-icon">
                                    <img src="assets/icons/collaboration.svg" alt="协议">
                                </div>
                                <div class="status-content">
                                    <h3>vPIN协议状态</h3>
                                    <p>协议合规性检查</p>
                                    <div class="status-details">
                                        <span class="detail-item">
                                            <img src="assets/icons/check.svg" alt="通过">
                                            协议版本: v1.0
                                        </span>
                                        <button class="btn-link" onclick="window.app.viewProtocolDetails()">查看详情</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/tauri-api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/task-dashboard.js"></script>
</body>
</html>
