<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全中心 - VDS-VPIN</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="app-container">
        <div id="header-container"></div>

        <div class="main-content">
            <div id="sidebar-container"></div>

            <div class="content-wrapper">
                <div class="page-container">
                    <div class="page-header">
                        <div class="page-title">
                            <h1>安全中心</h1>
                            <p>监控系统安全状态和管理安全配置</p>
                        </div>

                        <div class="quick-actions">
                            <button class="btn-primary tauri-action" data-action="run-security-check">
                                <img src="assets/icons/shield-check.svg" alt="检查">
                                安全检查
                            </button>
                            <button class="btn-secondary tauri-action" data-action="export-security-log">
                                <img src="assets/icons/download.svg" alt="导出">
                                导出日志
                            </button>
                        </div>
                    </div>

                    <!-- 安全概览 -->
                    <div class="tech-card" style="border-radius: 16px; padding: 24px; margin-bottom: 32px;">
                        <h2 style="color: #096dd9; margin-bottom: 24px; display: flex; align-items: center; gap: 12px;">
                            <img src="assets/icons/shield-check.svg" alt="安全概览" style="width: 24px; height: 24px;">
                            安全状态概览
                        </h2>

                        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px;">
                            <div class="security-metric">
                                <div class="metric-icon secure">
                                    <img src="assets/icons/lock-check.svg" alt="密钥" style="width: 24px; height: 24px;">
                                </div>
                                <div class="metric-value" id="keyStatus">安全</div>
                                <div class="metric-label">密钥保护</div>
                            </div>

                            <div class="security-metric">
                                <div class="metric-icon secure">
                                    <img src="assets/icons/encryption.svg" alt="加密" style="width: 24px; height: 24px;">
                                </div>
                                <div class="metric-value" id="encryptionStatus">启用</div>
                                <div class="metric-label">加密通信</div>
                            </div>

                            <div class="security-metric">
                                <div class="metric-icon warning">
                                    <img src="assets/icons/tee.svg" alt="TEE" style="width: 24px; height: 24px;">
                                </div>
                                <div class="metric-value" id="teeStatus">未启用</div>
                                <div class="metric-label">TEE保护</div>
                            </div>

                            <div class="security-metric">
                                <div class="metric-icon secure">
                                    <img src="assets/icons/audit.svg" alt="验证" style="width: 24px; height: 24px;">
                                </div>
                                <div class="metric-value" id="verificationStatus">就绪</div>
                                <div class="metric-label">验证模块</div>
                            </div>
                        </div>
                    </div>

                    <!-- 安全事件日志 -->
                    <div class="tech-card" style="border-radius: 16px; padding: 24px; margin-bottom: 32px;">
                        <h2 style="color: #096dd9; margin-bottom: 24px; display: flex; align-items: center; gap: 12px;">
                            <img src="assets/icons/history.svg" alt="日志" style="width: 24px; height: 24px;">
                            安全事件日志
                        </h2>

                        <div id="securityEventLog" class="event-log" style="max-height: 400px; overflow-y: auto;">
                            <!-- 安全事件将通过JavaScript动态加载 -->
                        </div>
                    </div>

                    <!-- 安全设置 -->
                    <div class="tech-card" style="border-radius: 16px; padding: 24px;">
                        <h2 style="color: #096dd9; margin-bottom: 24px; display: flex; align-items: center; gap: 12px;">
                            <img src="assets/icons/settings.svg" alt="设置" style="width: 24px; height: 24px;">
                            安全设置
                        </h2>

                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px;">
                            <div>
                                <h4 style="color: #262626; margin-bottom: 12px;">安全级别</h4>
                                <select id="securityLevelSelect" style="width: 100%; padding: 8px 12px; border: 1px solid #d9d9d9; border-radius: 6px;">
                                    <option value="standard">标准</option>
                                    <option value="high">高级</option>
                                    <option value="paranoid">最高级</option>
                                </select>
                            </div>

                            <div>
                                <h4 style="color: #262626; margin-bottom: 12px;">密钥轮换</h4>
                                <select id="keyRotationSelect" style="width: 100%; padding: 8px 12px; border: 1px solid #d9d9d9; border-radius: 6px;">
                                    <option value="never">从不</option>
                                    <option value="monthly">每月</option>
                                    <option value="weekly">每周</option>
                                    <option value="daily">每日</option>
                                </select>
                            </div>

                            <div>
                                <h4 style="color: #262626; margin-bottom: 12px;">审计日志</h4>
                                <div style="display: flex; align-items: center; gap: 12px;">
                                    <label style="display: flex; align-items: center; gap: 8px;">
                                        <input type="checkbox" id="auditLogEnabled" checked style="cursor: pointer;">
                                        <span style="color: #595959;">启用审计日志</span>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div style="display: flex; gap: 12px; margin-top: 24px;">
                            <button class="btn-primary tauri-action" data-action="save-security-settings" style="flex: 1;">
                                保存设置
                            </button>
                            <button class="btn-secondary" onclick="window.securityCenter.resetSecuritySettings()" style="flex: 1;">
                                重置默认
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/tauri-api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/security-center.js"></script>
</body>
</html>
