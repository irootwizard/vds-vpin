<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模型中心 - VDS-VPIN</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="app-container">
        <div id="header-container"></div>

        <div class="main-content">
            <div id="sidebar-container"></div>

            <div class="content-wrapper">
                <div class="page-container">
                    <div class="page-header">
                        <div class="page-title">
                            <h1>模型中心</h1>
                            <p>管理和选择用于隐私推理的预训练模型</p>
                        </div>

                        <div class="quick-actions">
                            <button class="btn-primary tauri-action" data-action="refresh-models">
                                <img src="assets/icons/refresh.svg" alt="刷新">
                                刷新模型
                            </button>
                            <button class="btn-secondary tauri-action" data-action="upload-model">
                                <img src="assets/icons/upload.svg" alt="上传">
                                上传模型
                            </button>
                        </div>
                    </div>

                    <!-- 模型列表 -->
                    <div class="model-grid" id="modelGrid">
                        <!-- 模型卡片将通过JavaScript动态加载 -->
                    </div>

                    <!-- 模型详情面板 -->
                    <div id="modelDetailPanel" class="model-detail-panel" style="display: none;">
                        <div class="tech-card" style="border-radius: 16px; padding: 24px;">
                            <div class="detail-header">
                                <h2 id="detailModelName">模型详情</h2>
                                <button class="btn-close" onclick="window.modelCenter.closeDetail()">
                                    <img src="assets/icons/delete.svg" alt="关闭">
                                </button>
                            </div>

                            <div id="detailContent">
                                <!-- 详情内容通过JavaScript填充 -->
                            </div>

                            <div class="detail-actions">
                                <button class="btn-primary tauri-action" data-action="select-model">
                                    选择此模型
                                </button>
                                <button class="btn-secondary" onclick="window.modelCenter.closeDetail()">
                                    取消
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/tauri-api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/model-center.js"></script>
</body>
</html>
